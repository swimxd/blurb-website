<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>if(location.hostname==="swimxd.github.io"){location.replace("https://blurb.fyi/flappy"+location.search+location.hash)}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Flappy Bird · Sky Club</title><style>
*{box-sizing:border-box}body{margin:0;background:#102a35;color:#f8f5e7;font-family:system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:18px}main{width:min(100%,440px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-size:12px;letter-spacing:3px;font-weight:800}.tag{font-size:11px;color:#9fb9bc}#game{position:relative;overflow:hidden;border:5px solid #203f49;border-radius:24px;box-shadow:0 24px 70px #0005;aspect-ratio:400/600;max-height:78svh;margin:auto}canvas{display:block;width:100%;height:100%;touch-action:none;background:#a9e2e0}#hud{position:absolute;top:20px;left:22px;right:22px;display:flex;align-items:start;justify-content:space-between;pointer-events:none}.label{font-size:10px;letter-spacing:2px;color:#284b51;font-weight:800}#score{font-size:46px;font-weight:900;line-height:1;color:#fff;text-shadow:0 3px #284b5155}#pause{pointer-events:auto;border:1px solid #ffffff80;background:#ffffff80;color:#234c52;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:#17373b10}#overlay.hidden{display:none}.panel{width:100%;padding:25px 20px;background:#fffbedee;border:1px solid white;border-radius:22px;box-shadow:0 12px 30px #244b4920;color:#173c43}.eyebrow{font-size:10px;font-weight:900;letter-spacing:3px;color:#537d76}h1{font-size:46px;line-height:1.05;letter-spacing:-2px;margin:12px 0}p{font-size:14px;line-height:1.5;color:#527072}button.play{border:0;border-radius:13px;background:#e8993b;color:#243e3e;font-weight:900;padding:14px 28px;font-size:15px;cursor:pointer;box-shadow:0 4px #bc7424;margin:6px 0 8px}button:focus-visible{outline:3px solid #183d47;outline-offset:4px}.stats{display:flex;justify-content:center;gap:35px;margin:20px}.stats b{display:block;font-size:28px}.stats span{font-size:10px;letter-spacing:2px}footer{display:flex;justify-content:space-between;font-size:11px;color:#a4bfc0;padding:14px 4px}kbd{font-family:inherit;border:1px solid #5e7d83;padding:2px 5px;border-radius:4px}#live{position:absolute;left:-9999px}@media(max-height:700px){header{margin-bottom:7px}footer{padding:8px 4px}body{padding:8px}h1{font-size:38px}}
</style></head><body><main><header><span class="brand">SKY CLUB <span style="color:#efb24f">✦</span></span><span class="tag">ONE MORE FLIGHT.</span></header><div id="game"><canvas id="canvas" width="400" height="600" aria-label="Flappy Bird game. Tap or press space to flap and fly through gaps."></canvas><div id="hud"><div><div class="label">SCORE</div><div id="score">0</div></div><button id="pause" aria-label="Pause game" title="Pause (P)">Ⅱ</button></div><div id="overlay"><div class="panel"><div class="eyebrow">A LITTLE BIRD. A BIG SKY.</div><h1>Flappy<br>Bird</h1><p>Find your rhythm.<br>Fly through the gaps. Stay in the sky.<br>Every 10 pipes, catch a surprise orb!</p><button class="play" id="start">Let’s fly →</button><p style="font-size:11px;margin-bottom:0">TAP ANYWHERE OR PRESS SPACE</p></div></div></div><footer><span><kbd>Space</kbd> flap &nbsp; <kbd>P</kbd> pause</span><span>Best flight <b id="best">0</b></span></footer><div id="live" aria-live="polite"></div></main><script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),pauseBtn=document.getElementById('pause'),live=document.getElementById('live');
const W=400,H=600,FLOOR=548,R=13;let state='ready',bird={x:102,y:270,v:0},pipes=[],score=0,best=0,clock=0,spawn=0,last=0,acc=0,deathAt=0,particles=[],orbs=[],power=null,powerLeft=0,trail=[],burst=[];const rainbow=['#ff638c','#ffae53','#ffe774','#68f2ad','#69caff','#bb8bff'];try{best=Number(localStorage.getItem('sky-club-best'))||0}catch{}bestEl.textContent=best;
function start(){bird={x:102,y:270,v:-340};pipes=[];particles=[];orbs=[];power=null;powerLeft=0;trail=[];burst=[];score=0;spawn=.6;scoreEl.textContent='0';state='playing';overlay.classList.add('hidden');pauseBtn.textContent='Ⅱ';pauseBtn.setAttribute('aria-label','Pause game');acc=0;live.textContent='Flight started.'}
function flap(){if(state==='ready')start();else if(state==='playing'){bird.v=-340;for(let i=0;i<4;i++)particles.push({x:bird.x-10,y:bird.y+5,vx:-60-Math.random()*50,vy:Math.random()*60-30,life:.35})}else if(state==='over'&&performance.now()-deathAt>400)start();}
function pause(){if(state==='playing'){state='paused';show('TAKE A BREATHER','Paused','Your sky will wait.','Resume →',resume)}else if(state==='paused')resume()}
function resume(){state='playing';overlay.classList.add('hidden');acc=0;last=performance.now()}
function show(eyebrow,title,body,button,action){overlay.innerHTML='<div class="panel"><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1>'+body+'<button class="play">'+button+'</button></div>';overlay.classList.remove('hidden');overlay.querySelector('button').onclick=action}
function end(){if(state!=='playing')return;state='over';deathAt=performance.now();const record=score>best;if(record){best=score;bestEl.textContent=best;try{localStorage.setItem('sky-club-best',best)}catch{}}show(record?'A NEW PERSONAL BEST!':'EVERY FLIGHT IS PRACTICE.','Nice flight.', '<div class="stats"><div><b>'+score+'</b><span>SCORE</span></div><div><b>'+best+'</b><span>BEST</span></div></div><p>Ready for another little adventure?</p>','Fly again ↻',start);live.textContent='Game over. Score '+score+'. Best '+best+'.'}
function hits(p){const nearestX=Math.max(p.x-4,Math.min(bird.x,p.x+66));for(const [y0,y1] of [[-100,p.center-p.gap/2],[p.center+p.gap/2,FLOOR]]){const ny=Math.max(y0,Math.min(bird.y,y1));if((bird.x-nearestX)**2+(bird.y-ny)**2<R*R)return true}return false}
function activatePower(){power=Math.random()<.5?'rainbow':'superman';powerLeft=10;trail=[];for(let i=0;i<24;i++){const a=i*Math.PI/12;burst.push({x:bird.x,y:bird.y,vx:Math.cos(a)*95,vy:Math.sin(a)*95,life:.7,color:rainbow[i%6]})}live.textContent=(power==='rainbow'?'Rainbow trail':'Superman')+' activated for 10 seconds!'}
function updatePower(dt,speed){
if(powerLeft>0){powerLeft=Math.max(0,powerLeft-dt);if(powerLeft===0){power=null;trail=[]}}
for(const o of orbs){o.x-=speed*dt;if(Math.hypot(bird.x-o.x,bird.y-o.y)<R+17){o.collected=true;activatePower()}}
orbs=orbs.filter(o=>!o.collected&&o.x>-25);
if(power==='rainbow'){for(const t of trail){t.x-=speed*dt;t.life-=dt}trail=trail.filter(t=>t.life>0);trail.push({x:bird.x-13,y:bird.y+3,life:.85})}
for(const b of burst){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}burst=burst.filter(b=>b.life>0);
}
function update(dt){clock+=dt;if(state!=='playing')return;bird.v+=1050*dt;bird.y+=bird.v*dt;spawn-=dt;const speed=145+Math.min(score*2,35);if(spawn<=0){const gap=166-Math.min(score,25);pipes.push({x:W+20,center:175+Math.random()*195,gap,passed:false});spawn=1.5}for(const p of pipes){p.x-=speed*dt;if(hits(p)){end();return}if(!p.passed&&p.x+66<bird.x-R){p.passed=true;score++;scoreEl.textContent=score;if(score%10===0)orbs.push({x:bird.x+85,y:p.center,collected:false})}}pipes=pipes.filter(p=>p.x>-80);if(bird.y+R>=FLOOR||bird.y-R<=0){end();return}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);updatePower(dt,speed)}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,0,32,14,'#ffffffb0');ellipse(-17,-8,17,17,'#ffffffb0');ellipse(8,-15,23,22,'#ffffffb0');ctx.restore()}
function pipe(x,y,h,top){if(h<=0)return;ctx.fillStyle='#23594d';ctx.fillRect(x-2,y,66,h);const g=ctx.createLinearGradient(x,0,x+62,0);g.addColorStop(0,'#70b579');g.addColorStop(.35,'#91ca87');g.addColorStop(1,'#4a916b');ctx.fillStyle=g;ctx.fillRect(x+1,y,60,h);ctx.fillStyle='#b7df98';ctx.fillRect(x+7,y,5,h);const lip=top?y+h-22:y;ctx.fillStyle='#23594d';ctx.fillRect(x-5,lip,72,24);ctx.fillStyle=g;ctx.fillRect(x-2,lip+3,66,18);ctx.fillStyle='#c4e5a1';ctx.fillRect(x+1,lip+3,59,3)}
function drawPower(){
ctx.save();
for(const o of orbs){const pulse=1+Math.sin(clock*6)*.1;ctx.shadowColor='#c57cff';ctx.shadowBlur=24;ellipse(o.x,o.y,17*pulse,17*pulse,'#b88cff');ctx.shadowBlur=0;ellipse(o.x-4,o.y-5,7,7,'#ffffffaa');ctx.strokeStyle='#fff7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(o.x,o.y,22,clock*2,clock*2+Math.PI*1.4);ctx.stroke();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 17px system-ui';ctx.fillText('✦',o.x,o.y+6)}
if(power==='rainbow'&&trail.length>1){ctx.lineCap='round';ctx.lineJoin='round';for(let c=0;c<6;c++){ctx.strokeStyle=rainbow[c];ctx.shadowColor=rainbow[c];ctx.shadowBlur=10;ctx.lineWidth=4;for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];ctx.globalAlpha=Math.max(0,a.life/.85)*.85;ctx.beginPath();ctx.moveTo(a.x,a.y+(c-2.5)*3);ctx.lineTo(b.x,b.y+(c-2.5)*3);ctx.stroke()}}}
ctx.shadowBlur=0;ctx.globalAlpha=1;for(const b of burst){ctx.globalAlpha=Math.max(0,b.life/.7);ellipse(b.x,b.y,3,3,b.color)}ctx.restore();
}
function drawPowerHud(){if(!power)return;ctx.save();ctx.fillStyle='#173c43dd';ctx.beginPath();ctx.roundRect(105,23,190,47,12);ctx.fill();ctx.fillStyle='#fffbed';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText((power==='rainbow'?'🌈 RAINBOW TRAIL':'★ SUPER BIRD')+'  '+Math.ceil(powerLeft)+'s',200,44);ctx.fillStyle='#ffffff30';ctx.fillRect(122,54,156,4);ctx.fillStyle=power==='rainbow'?'#ca9aff':'#ffcc61';ctx.fillRect(122,54,156*powerLeft/10,4);ctx.restore()}
function draw(){const bg=ctx.createLinearGradient(0,0,0,FLOOR);bg.addColorStop(0,'#83cfd6');bg.addColorStop(1,'#e0f1cc');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ellipse(322,105,36,36,'#fff3c6');for(let i=0;i<5;i++)cloud(((i*119-clock*9)%590+590)%590-80,110+(i%3)*63,.65+i%2*.3);ctx.fillStyle='#a7d8bb';ctx.beginPath();ctx.moveTo(0,FLOOR);for(let x=0;x<=W;x+=4)ctx.lineTo(x,465+Math.sin(x*.012+1)*27+Math.sin(x*.029)*9);ctx.lineTo(W,FLOOR);ctx.fill();ctx.fillStyle='#81bea5';ctx.beginPath();ctx.moveTo(0,FLOOR);for(let x=0;x<=W;x+=4)ctx.lineTo(x,505+Math.sin(x*.018+3)*17);ctx.lineTo(W,FLOOR);ctx.fill();for(const p of pipes){pipe(p.x,0,p.center-p.gap/2,true);pipe(p.x,p.center+p.gap/2,FLOOR-p.center-p.gap/2,false)}
drawPower();for(const p of particles)ellipse(p.x,p.y,3,3,'rgba(255,255,240,'+p.life/.35+')');ctx.save();const by=state==='ready'?270+Math.sin(clock*3)*7:bird.y;ctx.translate(bird.x,by);ctx.rotate(state==='ready'?-.1:Math.max(-.4,Math.min(1.15,bird.v/650)));if(power==='superman'){const wave=Math.sin(clock*15)*6;ctx.fillStyle='#d9434c';ctx.strokeStyle='#a82f40';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-6,-8);ctx.bezierCurveTo(-23,-7,-31,16+wave,-49,8+wave);ctx.lineTo(-41,25+wave);ctx.bezierCurveTo(-24,28,-15,12,0,9);ctx.closePath();ctx.fill();ctx.stroke()}ctx.fillStyle='#c88031';ctx.beginPath();ctx.moveTo(-10,-1);ctx.lineTo(-25,-9);ctx.lineTo(-21,5);ctx.lineTo(-10,9);ctx.fill();ellipse(0,0,18,15,'#765534');ellipse(0,-1,16,13,power==='superman'?'#4caaf2':'#ffd465');ellipse(-3,6,12,6,power==='superman'?'#2581d8':'#ffe8a2');ellipse(-8,Math.sin(clock*22)*3+2,9,5,power==='superman'?'#73bfff':'#e9a647');if(power==='superman'){ctx.fillStyle='#ffe071';ctx.strokeStyle='#df424b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-8,1);ctx.lineTo(4,1);ctx.lineTo(7,5);ctx.lineTo(-2,13);ctx.lineTo(-11,5);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d83e49';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText('S',-2,9);ellipse(6,-10,8,6,'#ffd465');ctx.strokeStyle='#293c4d';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-14);ctx.bezierCurveTo(7,-19,14,-14,8,-11);ctx.stroke()}ellipse(8,-5,7,8,'#fffdf2');ellipse(11,-5,3,4,'#233e44');ctx.fillStyle='#e78443';ctx.beginPath();ctx.moveTo(13,1);ctx.lineTo(26,5);ctx.lineTo(13,9);ctx.fill();ctx.restore();ctx.fillStyle='#365f4e';ctx.fillRect(0,FLOOR,W,4);ctx.fillStyle='#a7ce79';ctx.fillRect(0,FLOOR+4,W,12);ctx.fillStyle='#f0dfaa';ctx.fillRect(0,FLOOR+16,W,H);ctx.fillStyle='#d6c18c';for(let i=-1;i<24;i++){const x=i*22-(clock*70%22);ctx.fillRect(x,FLOOR+6,12,3)}ctx.fillStyle='#dfcb95';for(let i=0;i<25;i++)ctx.fillRect(i*31%400,574+i%3*8,4,2);drawPowerHud()}
function frame(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.05);last=t;if(state!=='paused'){acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}}draw();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.getElementById('start').onclick=start;pauseBtn.onclick=pause;document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyP','Escape'].includes(e.code)){if(e.target.tagName==='BUTTON'&&e.code==='Space')return;e.preventDefault();if(e.repeat)return;if(e.code==='KeyP'||e.code==='Escape')pause();else if(state==='paused')resume();else flap()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});requestAnimationFrame(frame);
})();
</script></body></html>
